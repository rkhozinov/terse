apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-service
  namespace: test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tracking-service
  template:
    metadata:
      labels:
        app: tracking-service
    spec:
      containers:
        - name: app
          image: tracking-service:1.4.2
          ports:
            - containerPort: 8080
